{% extends "base.html" %}
{% load i18n %}

{% block content %}

<div class="max-w-xl mx-auto mt-16 bg-white dark:bg-gray-800 shadow-xl rounded-xl p-8">

    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">
        {% trans "Supprimer mon compte" %}
    </h2>

    <p class="text-red-600 dark:text-red-400 font-semibold mb-6">
        {% trans "⚠️ Cette action est irréversible. Toutes vos données seront définitivement supprimées." %}
    </p>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <button type="submit"
                class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow transition">
            {% trans "Supprimer mon compte définitivement" %}
        </button>

        <div class="text-center">
            <a href="{% url 'profile' %}"
               class="text-sm text-gray-600 dark:text-gray-300 hover:underline">
                {% trans "Annuler" %}
            </a>
        </div>
    </form>

</div>

{% endblock %}
