{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Mot de passe modifié" %}{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-20 px-4">

    <div class="bg-green-50 dark:bg-green-900 text-green-800 dark:text-green-200 
                border border-green-200 dark:border-green-700 
                shadow-md rounded-xl p-6 text-center">

        <p class="text-lg leading-relaxed">
            {% trans "Votre mot de passe a été changé avec succès. Vous pouvez maintenant vous" %}
            <a href="{% url 'login' %}" class="underline font-semibold">
                {% trans "connecter" %}
            </a>.
        </p>

    </div>

</div>

{% endblock %}
