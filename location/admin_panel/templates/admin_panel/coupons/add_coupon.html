{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 px-4">

    <!-- TITRE -->
    <h2 class="text-3xl font-bold mb-6 text-primary">➕ Ajouter un coupon</h2>

    <!-- BOUTON RETOUR -->
    <a href="{% url 'admin_panel:admin_coupon_list' %}"
       class="inline-block mb-6 px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition">
        ⬅ Retour
    </a>

    <!-- CARD -->
    <div class="bg-card shadow-lg rounded-lg border border-primary/20">
        <div class="p-6">

            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- CODE -->
                <div>
                    <label class="block font-semibold mb-1">Code du coupon</label>
                    <input type="text" name="{{ form.code.name }}" value="{{ form.code.value|default:'' }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                </div>

                <!-- DESCRIPTION -->
                <div>
                    <label class="block font-semibold mb-1">Description</label>
                    <textarea name="{{ form.description.name }}"
                            class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">{{ form.description.value|default:'' }}</textarea>
                </div>

                <!-- TYPE DE REDUCTION -->
                <div>
                    <label class="block font-semibold mb-1">Type de réduction</label>
                    <select name="{{ form.discount_type.name }}"
                            class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                        {% for value, label in form.fields.discount_type.choices %}
                            <option value="{{ value }}" {% if form.discount_type.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- VALEUR DE LA REDUCTION -->
                <div>
                    <label class="block font-semibold mb-1">Valeur de la réduction</label>
                    <input type="number" step="0.01" name="{{ form.discount_value.name }}" value="{{ form.discount_value.value|default:'' }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                </div>

                <!-- DATE DEBUT -->
                <div>
                    <label class="block font-semibold mb-1">Date de début</label>
                    <input type="date" name="{{ form.date_debut.name }}" value="{{ form.date_debut.value|default:'' }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                </div>

                <!-- DATE FIN -->
                <div>
                    <label class="block font-semibold mb-1">Date de fin</label>
                    <input type="date" name="{{ form.date_fin.name }}" value="{{ form.date_fin.value|default:'' }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                </div>

                <!-- UTILISATION MAX -->
                <div>
                    <label class="block font-semibold mb-1">Utilisation maximale</label>
                    <input type="number" name="{{ form.utilisation_max.name }}" value="{{ form.utilisation_max.value|default:'' }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
                </div>

                <!-- ACTIF -->
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="{{ form.actif.name }}" {% if form.actif.value %}checked{% endif %}
                        class="w-5 h-5">
                    <label class="font-semibold">Actif</label>
                </div>

                <!-- BOUTON -->
                <button type="submit"
                        class="px-5 py-2 bg-green-600 text-white font-semibold rounded hover:bg-green-700 transition">
                    💾 Enregistrer
                </button>

            </form>

        </div>
    </div>

</div>
{% endblock %}
