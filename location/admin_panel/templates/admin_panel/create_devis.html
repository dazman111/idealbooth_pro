{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">➕ Créer un devis</h1>

<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit"

        Enregistrer le devis
    </button>
</form>
{% endblock %}
