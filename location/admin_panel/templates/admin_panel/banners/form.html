{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10 px-4">

    <h2 class="text-3xl font-bold mb-6 text-primary">{{ title }}</h2>

    <a href="{% url 'admin_panel:banner_list' %}"
       class="inline-block mb-6 px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition">
        ⬅ Retour
    </a>

    <div class="bg-card shadow-xl rounded-xl border border-primary/20 p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block font-semibold mb-1">Message</label>
                <input type="text" name="{{ form.message.name }}" value="{{ form.message.value|default:'' }}"
                       class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base" required>
            </div>

            <div>
                <label class="block font-semibold mb-1">Code promo (optionnel)</label>
                <input type="text" name="{{ form.promo_code.name }}" value="{{ form.promo_code.value|default:'' }}"
                       class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base">
            </div>

            <div>
                <label class="block font-semibold mb-1">Date de début</label>
                <input type="datetime-local" name="{{ form.start_date.name }}" value="{{ form.start_date.value|date:'Y-m-d\TH:i'|default:'' }}"
                       class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base" required>
            </div>

            <div>
                <label class="block font-semibold mb-1">Date de fin</label>
                <input type="datetime-local" name="{{ form.end_date.name }}" value="{{ form.end_date.value|date:'Y-m-d\TH:i'|default:'' }}"
                       class="w-full px-3 py-2 rounded border border-gray-300 bg-base text-base" required>
            </div>

            <button type="submit"
                    class="px-5 py-2 bg-green-600 text-white font-semibold rounded hover:bg-green-700 transition">
                💾 Enregistrer
            </button>
        </form>
    </div>

</div>
{% endblock %}
