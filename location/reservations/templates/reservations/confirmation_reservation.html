<div class="container mt-5">
    <h2 class="mb-4">Confirmation de réservation</h2>

    <form method="POST" action="{% url 'paiement' %}">
        {% csrf_token %}

        <ul class="list-group mb-3">
            {% for article in selected_articles %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>
                        {{ article.photobooth.name }}
                        – {{ article.photobooth.price }} €
                    </span>

                    <input type="hidden" name="selected_articles[]" value="{{ article.id }}">
                </li>
            {% endfor %}
        </ul>

        <p class="fs-5">
            Total : <strong>{{ total_amount }} €</strong>
        </p>

        <button type="submit" class="btn btn-success">
            Procéder au paiement
        </button>
    </form>
</div>
